name: Release

# Every push to main runs this:
#
# - Pending changesets: open or update the "chore: version packages" PR, which
#   bumps every package (one `fixed` group, see .changeset/config.json) and
#   writes the changelogs.
# - That PR was just merged (versions in package.json not on npm yet): build and
#   publish to npm with the NPM_TOKEN secret, then cut the `vX.Y.Z` GitHub
#   release with the Chrome extension zip attached.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # In the user config: pnpm does not expand env vars in a project `.npmrc`.
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Opens the version PR when there are changesets, otherwise runs
      # `pnpm release` (build + `changeset publish`). The PR is opened with
      # GITHUB_TOKEN, so it does not trigger ci.yml (which skips it anyway).
      # Tags and the GitHub release are cut below: one `vX.Y.Z` release for the
      # whole fixed group instead of one per package.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false

      # `wxt zip` writes `.output/openshowcase-extension-<version>-chrome.zip`
      # (see wxt.config.ts). The workspace packages are already built by
      # `pnpm release`.
      - name: Build the extension zip
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter @rustrak/openshowcase-extension zip

      # --target creates the tag together with the release, so a failed call
      # leaves no orphaned tag behind. --generate-notes appends GitHub's PR and
      # contributor list to the body.
      - name: Create the GitHub release
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          TAG="v$VERSION"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi

          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"

          gh release create "$TAG" \
            "apps/extension/.output/openshowcase-extension-$VERSION-chrome.zip" \
            --target "$GITHUB_SHA" \
            --title "OpenShowcase $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
